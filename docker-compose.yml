services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: tienda_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - tienda_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: tienda_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend
    networks:
      - tienda_network

networks:
  tienda_network:
    driver: bridge
